plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Mod Menu (soft dependency, compile-time only)
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Only needed to compile the ModMenuApi entrypoint; the mod runs fine without Mod Menu installed.
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}

	// Dev-environment only (runClient), so the Mod Menu config screen can be tested. Not bundled, not a dependency.
	localRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	localRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
